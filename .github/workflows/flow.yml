name: Add R2 producer attestation CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: codex/ppi-r11-r2-provenance-attestation
          token: ${{ secrets.RAW_TOKEN }}
          persist-credentials: true

      - name: Add or refresh focused PR validation
        env:
          CI_WORKFLOW_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$CI_WORKFLOW_B64" | base64 --decode             > .github/workflows/validate-r11-producer-attestation.yml

      - name: Validate workflow source and focused tests
        run: |
          set -euo pipefail
          python -m py_compile             src/publish_private_handoff.py             src/publish_prepared_private_handoff.py
          python -m unittest tests.test_attested_private_handoff_workflow -v
          grep -F 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'             .github/workflows/validate-r11-producer-attestation.yml
          grep -F 'actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26'             .github/workflows/collect-r11-public-evidence.yml

      - name: Commit and push CI definition
        env:
          GH_TOKEN: ${{ secrets.RAW_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ppi-r11-remediation"
          git config user.email "ppi-r11-remediation@users.noreply.github.com"
          git add .github/workflows/validate-r11-producer-attestation.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Focused CI definition already current"
            exit 0
          fi
          git commit -m "Add focused CI for producer attestation gate"
          git push origin HEAD:codex/ppi-r11-r2-provenance-attestation
