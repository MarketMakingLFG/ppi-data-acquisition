name: Apply R2 producer attestation remediation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: codex/ppi-r11-r2-provenance-attestation
          token: ${{ secrets.RAW_TOKEN }}
          persist-credentials: true

      - name: Write remediation files
        env:
          HELPER_B64: 
          TEST_B64: 
          PATCHER_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$HELPER_B64" | base64 --decode > src/publish_prepared_private_handoff.py
          printf '%s' "$TEST_B64" | base64 --decode > tests/test_attested_private_handoff_workflow.py
          printf '%s' "$PATCHER_B64" | base64 --decode > "$RUNNER_TEMP/apply_attestation_patch.py"
          chmod +x src/publish_prepared_private_handoff.py
          python "$RUNNER_TEMP/apply_attestation_patch.py"

      - name: Run focused tests
        run: |
          set -euo pipefail
          python -m py_compile src/publish_private_handoff.py src/publish_prepared_private_handoff.py
          python -m unittest tests.test_attested_private_handoff_workflow -v

      - name: Commit and push remediation
        env:
          GH_TOKEN: ${{ secrets.RAW_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ppi-r11-remediation"
          git config user.email "ppi-r11-remediation@users.noreply.github.com"
          git add .github/workflows/collect-r11-public-evidence.yml src/publish_prepared_private_handoff.py tests/test_attested_private_handoff_workflow.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
            exit 0
          fi
          git commit -m "Add producer provenance attestation gate"
          git push origin HEAD:codex/ppi-r11-r2-provenance-attestation
