name: Mark R2 producer attestation PR ready

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR #5 ready for review
        env:
          GH_TOKEN: ${{ secrets.RAW_TOKEN }}
        run: |
          set -euo pipefail

          state="$(
            gh pr view 5 \
              --repo spoudel2010-ux/ppi-data-acquisition \
              --json isDraft \
              --jq '.isDraft'
          )"

          if [ "$state" = "false" ]; then
            echo "PR #5 is already ready for review"
            exit 0
          fi

          gh pr ready 5 \
            --repo spoudel2010-ux/ppi-data-acquisition
