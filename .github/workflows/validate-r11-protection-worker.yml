name: Validate R11 independent protection Worker
on:
  pull_request:
    paths:
      - 'deployment-protection/r11-worker/**'
      - '.github/workflows/validate-r11-protection-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reject-only webhook unit tests
        run: node --test deployment-protection/r11-worker/worker.test.mjs
