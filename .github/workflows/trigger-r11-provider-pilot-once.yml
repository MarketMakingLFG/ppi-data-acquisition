name: Trigger R11 provider pilot once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/trigger-r11-provider-pilot-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical protected R11 collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          request_id="r11-batch3-${GITHUB_SHA:0:8}"
          gh api -X POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/collect-r11-public-evidence.yml/dispatches"             -f ref=main             -f 'inputs[confirmation]=COLLECT-R11-BATCH-3'             -f "inputs[request_id]=${request_id}"
          echo "Dispatched protected R11 provider pilot request_id=${request_id}"
